[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tehran-market-data"
version = "1.0.0"
description = "Clients for Iranian capital-market data (TSETMC prices, base volume and shareholders; FIPIRAN mutual funds; Mabna instruments) and a fund-manager network analysis."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Amirmahdi Shokatabadi"}]
requires-python = ">=3.10"
dependencies = ["pandas>=1.5", "requests>=2.28", "networkx>=3.0", "jdatetime>=4.1"]

[project.optional-dependencies]
viz = ["pyvis>=0.3"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
